name: Publicar site

on:
  push:
    branches: [main]
  # Botão "Publicar alterações" do painel (via Edge Function do Supabase)
  repository_dispatch:
    types: [publicar]
  # Execução manual pela aba Actions do GitHub
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Sem o banco, o build usaria o conteúdo inicial do repositório e ignoraria o painel.
      - name: Conferir segredos
        id: segredos
        env:
          URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          FTP: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$URL" ] || [ -z "$FTP" ]; then
            echo "::warning::Publicação ignorada: configure os segredos do repositório (README, passo 4)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar site com o conteúdo do Supabase
        if: steps.segredos.outputs.ok == 'true'
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      # Cópia do site gerado para download (aba Actions → execução → Artifacts),
      # útil para enviar manualmente pelo Gerenciador de arquivos da Hostinger.
      - name: Guardar site gerado (.zip)
        if: steps.segredos.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-kmbim
          path: dist/
          include-hidden-files: true
          retention-days: 30

      # Aceita o endereço como a Hostinger mostra (ex.: ftp://123.45.67.89/) e remove espaços.
      - name: Preparar endereço FTP
        if: steps.segredos.outputs.ok == 'true'
        id: ftp
        env:
          BRUTO: ${{ secrets.FTP_SERVER }}
        run: |
          HOST=$(printf '%s' "$BRUTO" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          echo "::add-mask::$HOST"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: Enviar para a Hostinger (FTP)
        if: steps.segredos.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # O certificado FTP da Hostinger é emitido para o servidor dela, não para o domínio:
          # mantém a conexão criptografada sem exigir que o nome confira.
          security: loose
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
